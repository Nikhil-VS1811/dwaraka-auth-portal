<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Euphoria+Script&display=swap" rel="stylesheet">
    <title>Odin project</title>
</head>
<body>
    <div class="container">
        <!--left side part of the page-->
        <div class="left">
            <div class="logo">
                <img src="images/logo.png" alt="dwaraka logo">
                <h1>Welcome to Dwaraka</h1>
            </div>
            <p class="credits">Image taken from <a href="https://www.zedge.net/wallpapers/ba04023c-653a-4637-b0da-d41dd1464efc">zedge</a></p>
        </div>
        
        <!--right part of the page-->
        <div class="right">
            <div class="intros">
                <p class="welcome">Get ready to Sign-in to the world of <em>Lord Krishna</em></p>
            </div>
            <form>
                
                <div class="form-section">
                    <h2>Let's Sign-Up</h2>
                    <div class="grid">

                        <div>
                            <label for="firstname">First Name *</label>
                            <input id="firstname" type="text" placeholder="Nikhil" required>
                        </div>

                        <div>
                            <label for="lastname">Last Name *</label>
                            <input id="lastname" type="text" placeholder="VS" required>
                        </div>

                        <div>
                            <label for="email">Email-ID</label>
                            <input id="email" type="email" placeholder="nikhilvs1811@gmail.com" required>
                        </div>

                        <div>
                            <label for="phone">Phone No.</label>
                            <input id="phone" type="tel" pattern="[0-9]{10}" title="Please Enter only 10 digits" placeholder="98765 43210" required>
                        </div>

                        <div>
                            <label for="password">Password *</label>
                            <input id="password" type="password" required>
                        </div>

                        <div>
                            <label for="confirm-pass">Confirm Password *</label>
                            <input id="confirm-pass" type="password" required>
                        </div>
                    </div>                    
                </div>

                <div class="form-action">
                    <button id="btn" type="submit">Create Account</button>
                    <p class="login">
                        Already have an account ?<a href="#">Log-In</a>
                    </p>
                </div>

            </form>
         </div>
    </div>
    
</body>
</html>
